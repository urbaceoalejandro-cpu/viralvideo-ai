<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="description" content="ViralVideo AI - generador de videos para YouTube">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>ViralVideo AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:auto;padding:24px 18px 42px}.brand{font-size:30px;font-weight:850;margin-bottom:5px}.sub{color:#aaa;font-size:14px;margin-bottom:24px}
.card{background:#15151e;border:1px solid #272735;border-radius:20px;padding:18px;margin-bottom:14px}
label{display:block;color:#aaa;font-size:12px;font-weight:750;margin-bottom:8px;text-transform:uppercase}
textarea,select,input{width:100%;background:#0f0f16;color:#fff;border:1px solid #30303e;border-radius:12px;padding:14px;font-size:16px;outline:none}
textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:#7c4dff;cursor:pointer}
button:disabled{opacity:.55}.secondary{background:#242431}.status{color:#c9c9d6;line-height:1.5;white-space:pre-line}
.scene{padding:12px;border-radius:12px;background:#101018;margin-top:9px;border:1px solid #292936}.small{font-size:12px;color:#9696a6}
.progress{height:8px;background:#272735;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:#7c4dff;transition:.25s}
.video{width:100%;border-radius:14px;margin-top:14px;background:#000}.download{display:block;text-align:center;text-decoration:none;margin-top:12px}
.badge{display:inline-block;border:1px solid #383849;border-radius:999px;padding:6px 10px;color:#bbb;font-size:12px;margin-top:8px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">🔥 ViralVideo AI</div>
<div class="sub">Crea videos de aproximadamente 3 minutos para YouTube.</div>

<section class="card">
<label>Tema del video</label>
<textarea id="topic" placeholder="Ej: 5 misterios del océano que nadie puede explicar"></textarea>
</section>

<section class="card">
<div class="row">
<div><label>Estilo</label><select id="style">
<option>Viral / Cinematográfico</option><option>Gaming</option><option>Noticias / Actualidad</option>
<option>Misterio / Terror</option><option>Tecnología</option><option>Deportes</option><option>Entretenimiento</option>
</select></div>
<div><label>Voz</label><select id="voice">
<option>Masculina</option><option>Femenina</option><option>Energética</option><option>Documental</option>
</select></div>
</div>
</section>

<section class="card">
<button id="generate">🚀 GENERAR VIDEO</button>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="status" class="status">Listo para crear tu próximo video.</div>
</section>

<section id="result" class="card" hidden>
<label>Video generado</label>
<div id="scenes"></div>
<video id="player" class="video" controls playsinline hidden></video>
<a id="download" class="download" hidden download="viralvideo-ai.mp4">
<button type="button">⬇️ DESCARGAR MP4</button>
</a>
<button id="copy" class="secondary" style="margin-top:14px">📋 COPIAR GUION</button>
</section>

<section class="card">
<div class="small">Las claves de IA se mantienen en el servidor. Esta interfaz no contiene secretos.</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let generated="";
function setProgress(p){$("bar").style.width=p+"%"}
function showScenes(scenes){
 $("scenes").innerHTML=scenes.map(s=>`<div class="scene"><b>${s.n}. ${s.title}</b><div class="small">${s.narration||s.text||""}</div></div>`).join("");
}
$("generate").onclick=async()=>{
 const topic=$("topic").value.trim();
 if(!topic){$("topic").focus();return}
 $("generate").disabled=true;$("result").hidden=true;$("player").hidden=true;$("download").hidden=true;
 setProgress(4);$("status").textContent="⏳ Preparando el guion...";
 let fake=setInterval(()=>{let w=parseInt($("bar").style.width)||4;if(w<88)setProgress(w+2)},700);
 try{
   const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({topic,style:$("style").value,voice:$("voice").value})});
   const data=await r.json();
   if(!r.ok) throw new Error(data.error||"No se pudo generar el video.");
   clearInterval(fake);setProgress(100);
   generated=data.script||data.scenes.map(s=>s.narration).join("\\n\\n");
   showScenes(data.scenes||[]);
   $("status").textContent="✅ Video terminado. Puedes reproducirlo o descargarlo.";
   $("result").hidden=false;
   if(data.videoUrl){
     $("player").src=data.videoUrl;$("player").hidden=false;
     $("download").href=data.videoUrl;$("download").hidden=false;
   }
 }catch(e){
   clearInterval(fake);setProgress(0);
   $("status").textContent="❌ "+e.message;
   $("result").hidden=false;
 }finally{$("generate").disabled=false}
};
$("copy").onclick=async()=>{
 try{await navigator.clipboard.writeText(generated);$("copy").textContent="✅ GUION COPIADO";setTimeout(()=>$("copy").textContent="📋 COPIAR GUION",1400)}
 catch(e){alert(generated)}
};
</script>
</body>
</html>
